<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>叶语识界后台 | 素材管理</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <script type="module" src="../assets/admin.js"></script>
  </head>
  <body data-page="adminMedia" data-base-path="../">
    <header class="site-header" data-site-header></header>
    <main class="page-main">
      <div class="shell">
        <div class="admin-grid">
          <section class="admin-panel">
            <h1>素材管理</h1>
            <form id="media-upload-form">
              <div class="admin-form-grid">
                <label class="field wide"><span>上传文件</span><input name="file" type="file" required /></label>
                <label class="field"><span>素材分类</span><input name="category" /></label>
                <label class="field"><span>替代文本</span><input name="altText" /></label>
              </div>
              <button class="primary-button" type="submit">上传素材</button>
            </form>
            <hr />
            <form id="media-meta-form">
              <input type="hidden" name="id" />
              <div class="admin-form-grid">
                <label class="field"><span>素材分类</span><input name="category" /></label>
                <label class="field"><span>替代文本</span><input name="altText" /></label>
                <label class="field"><span>来源名称</span><input name="sourceName" /></label>
                <label class="field"><span>来源链接</span><input name="sourceUrl" /></label>
                <label class="field"><span>授权名称</span><input name="licenseName" /></label>
                <label class="field"><span>作者</span><input name="creatorName" /></label>
              </div>
              <button class="primary-button" type="submit">保存元数据</button>
            </form>
            <div data-flash></div>
          </section>
          <aside id="admin-media-list" class="admin-list"></aside>
        </div>
      </div>
    </main>
    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
